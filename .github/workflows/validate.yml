name: Validate dashboard and bot

on:
  pull_request:
    branches: [main]
  push:
    branches: ['*']

jobs:
  syntax-and-bundle-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check server and dashboard JavaScript syntax
        run: |
          node --check server.js
          node --check public/script.js
          node --check lib/role-utils.js
          node --check lib/security-utils.js
          node --check lib/db-ssl-utils.js
          node --check lib/ticket-utils.js
          node --check lib/media-utils.js
          node --check lib/community-utils.js
          node --check lib/moderation-utils.js
          node --check lib/duration-utils.js
          node --check lib/poll-utils.js
          node --check lib/activity-utils.js
          node --check lib/verification-utils.js
          node --check lib/giveaway-utils.js
          node --check lib/suggestion-utils.js
          node --check lib/shop-utils.js
          node --check lib/economy-utils.js
          node --check lib/sales-utils.js
          node --check lib/temp-voice-utils.js
          node --check lib/tag-utils.js
          node --check lib/page-utils.js
          node --check lib/command-routing-utils.js
          node --check lib/ux-utils.js
          node --check lib/message-template-utils.js
          node --check lib/automod-utils.js
          node --check lib/xp-utils.js
          node --check lib/migration-utils.js
          node --test tests/*.test.js
      - name: Check embedded JavaScript in public HTML pages
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const directory = 'public';
          const htmlFiles = fs.readdirSync(directory).filter(name => name.endsWith('.html'));
          let inlineScriptCount = 0;
          for (const filename of htmlFiles) {
            const source = fs.readFileSync(path.join(directory, filename), 'utf8');
            for (const match of source.matchAll(new RegExp('<script\\b[^>]*>([\\s\\S]*?)</script\\s*>', 'gi'))) {
              const code = match[1].trim();
              if (!code) continue;
              try { new Function(code); }
              catch (error) { throw new Error(filename + ' has invalid inline JavaScript: ' + error.message); }
              inlineScriptCount++;
            }
          }
          if (!inlineScriptCount) throw new Error('No inline public scripts were checked.');
          console.log('Parsed ' + inlineScriptCount + ' embedded public scripts across ' + htmlFiles.length + ' HTML pages.');
          NODE