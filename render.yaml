services:
  - type: web
    name: aki-discord-control
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_NAME
        value: Aki Dev
      - key: SITE_URL
        value: https://aki-discord-control-6yfp.onrender.com
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: SESSION_ENCRYPTION_KEY
        sync: false
      - key: COMMAND_COOLDOWN_MS
        value: "1200"
      - key: BOT_PRESENCE_TEXT
        value: "Aki Dev · /help"
      - key: BOT_PRESENCE_TYPE
        value: Watching
      - key: BOT_PRESENCE_STATUS
        value: online
      - key: DATABASE_URL
        fromDatabase:
          name: aki-discord-db
          property: connectionString

databases:
  - name: aki-discord-db
    plan: basic-256mb
    diskSizeGB: 1
    region: singapore
