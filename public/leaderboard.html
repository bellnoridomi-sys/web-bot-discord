<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark"><title>Aki Dev · Server Leaderboard</title>
<style>
:root{color-scheme:dark;--bg:#080808;--panel:#111;--line:#292929;--muted:#999;--white:#f4f4f1}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1a1a1a,#080808 55%);color:var(--white);font:14px/1.6 Inter,system-ui,Segoe UI,sans-serif;min-height:100vh;padding:28px}
main{max-width:920px;margin:6vh auto}.brand{color:#9b9b96;letter-spacing:.23em;font-size:10px;font-weight:800}h1{font-size:clamp(34px,6vw,64px);line-height:1;margin:18px 0;letter-spacing:-.05em}p{color:var(--muted)}.panel{margin-top:28px;background:rgba(20,20,20,.88);border:1px solid var(--line);border-radius:22px;padding:20px}.top{display:flex;align-items:center;gap:14px}.icon{width:54px;height:54px;border-radius:16px;object-fit:cover;background:#222}.controls{display:flex;gap:8px;margin:20px 0}.controls button,a{border:1px solid #3a3a3a;background:#141414;color:#eee;padding:10px 15px;border-radius:999px;text-decoration:none;cursor:pointer}.controls button.active{background:#eee;color:#111}.row{display:grid;grid-template-columns:45px 1fr auto;gap:14px;align-items:center;padding:13px 2px;border-bottom:1px solid #242424}.row:last-child{border:0}.rank{font-size:21px;color:#6f6f69;font-weight:800}.user{font-weight:700}.sub{font-size:12px;color:#888}.score{text-align:right;font-weight:700}.empty{color:#aaa;padding:20px 0}.footer{margin-top:28px;font-size:11px;color:#777;display:flex;gap:14px;flex-wrap:wrap}@media(max-width:560px){body{padding:18px}.panel{padding:14px}.row{grid-template-columns:32px 1fr auto;gap:9px}.score{font-size:12px}}
</style></head>
<body><main>
<div class="brand">AKI DEV / PUBLIC STATS</div>
<h1>Server leaderboard<span style="color:#777">.</span></h1>
<p>Bảng xếp hạng công khai theo server. Dữ liệu chỉ khả dụng khi bot có mặt trong server và đã ghi nhận XP/xu.</p>
<section class="panel">
<div class="top"><img id="guildIcon" class="icon" alt="" hidden><div><div class="brand">SERVER</div><h2 id="guildName" style="margin:2px 0;font-size:22px">Đang tải…</h2><div class="sub" id="guildMeta"></div></div></div>
<div class="controls"><button data-type="levels" class="active">LEVEL / XP</button><button data-type="coins">COINS / XU</button></div>
<div id="rows" aria-live="polite"><div class="empty">Đang lấy dữ liệu…</div></div>
</section>
<div class="footer"><a href="/">Aki Dev home</a><a href="/invite">Add to Discord</a><a href="/privacy">Privacy</a><a href="/terms">Terms</a></div>
</main>
<script>
const guildId=location.pathname.split('/').filter(Boolean).pop();
let selectedType='levels';
const $=id=>document.getElementById(id);
function safeNumber(v){return Number(v||0).toLocaleString('vi-VN')}
async function load(){
 $('rows').textContent='Đang tải…';
 try{
  const response=await fetch('/api/public/guilds/'+encodeURIComponent(guildId)+'/leaderboard?type='+selectedType,{headers:{Accept:'application/json'}});
  const data=await response.json();
  if(!response.ok)throw new Error(response.status===404?'Bot chưa tham gia server này hoặc chưa có dữ liệu.':'Không thể tải bảng xếp hạng.');
  $('guildName').textContent=data.guild.name;
  $('guildMeta').textContent='Server ID: '+data.guild.id;
  const image=$('guildIcon');if(data.guild.icon){image.src=data.guild.icon;image.hidden=false}else image.hidden=true;
  const rows=$('rows');rows.replaceChildren();
  if(!data.rows.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='Chưa có dữ liệu xếp hạng.';rows.append(empty);return}
  for(const item of data.rows){
   const line=document.createElement('div');line.className='row';
   const rank=document.createElement('div');rank.className='rank';rank.textContent=String(item.rank).padStart(2,'0');
   const info=document.createElement('div');const user=document.createElement('div');user.className='user';user.textContent='Discord user '+item.userId.slice(-4);const sub=document.createElement('div');sub.className='sub';sub.textContent='Level '+item.level+' · '+safeNumber(item.xp)+' XP';info.append(user,sub);
   const score=document.createElement('div');score.className='score';score.textContent=selectedType==='coins'?safeNumber(item.coins)+' xu':'Level '+item.level;
   line.append(rank,info,score);rows.append(line);
  }
 }catch(error){$('rows').textContent=error.message||'Không thể tải bảng xếp hạng.'}
}
document.querySelectorAll('[data-type]').forEach(button=>button.addEventListener('click',()=>{selectedType=button.dataset.type;document.querySelectorAll('[data-type]').forEach(el=>el.classList.toggle('active',el===button));load()}));
load();
</script></body></html>
