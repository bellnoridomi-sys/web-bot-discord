<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Aki Dev · Activity</title><style>
:root{color-scheme:dark;--bg:#080808;--panel:#121212;--line:#2b2b2b;--muted:#9b9b95;--fg:#f4f4f1}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#191919,#080808 58%);color:var(--fg);font:14px/1.55 Inter,system-ui,sans-serif;padding:22px}main{max-width:1060px;margin:5vh auto}.eyebrow{font-size:10px;letter-spacing:.2em;color:#999}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}h1{font-size:clamp(36px,6vw,62px);letter-spacing:-.05em;line-height:1.02;margin:15px 0}.muted{color:var(--muted)}.panel{border:1px solid var(--line);border-radius:20px;background:rgba(17,17,17,.93);padding:18px;margin-top:22px}.filters{display:grid;grid-template-columns:1.3fr 2fr auto auto;gap:10px}.filters input,.filters select,button{background:#090909;border:1px solid #333;border-radius:11px;color:#eee;padding:11px 12px;min-width:0}.filters button,.pager button{cursor:pointer}.items{margin-top:14px}.item{border-bottom:1px solid #252525;padding:13px 0;display:grid;grid-template-columns:160px 180px 1fr;gap:12px}.item:last-child{border:0}.time,.action{font-size:11px;color:#999;overflow-wrap:anywhere}.details{overflow-wrap:anywhere}.pager{display:flex;gap:8px;align-items:center;margin-top:15px}.pager span{flex:1;color:#999}.links{display:flex;gap:12px;flex-wrap:wrap;margin-top:25px}.links a{color:#bbb;text-decoration:none;border-bottom:1px solid #444;padding-bottom:4px}.error{color:#ff9b9b}@media(max-width:700px){.filters{grid-template-columns:1fr}.item{grid-template-columns:1fr;gap:4px}}
</style></head><body><main><div class="top"><div><div class="eyebrow">AKI DEV / AUDIT STREAM</div><h1>Activity<span style="color:#777">.</span></h1><div class="muted">Lọc, tìm kiếm, phân trang và xuất nhật ký theo server bạn quản lý.</div></div><div class="eyebrow" id="status">CHECKING SESSION</div></div><section class="panel"><div class="filters"><select id="guild"><option value="">Đang tải server…</option></select><input id="q" placeholder="Tìm action, actor ID, chi tiết…"><button id="search">TÌM KIẾM</button><button id="export">XUẤT CSV ↗</button></div><div id="items" class="items" aria-live="polite">Đang tải…</div><div class="pager"><button id="prev">← Trước</button><span id="pageText">Trang 1</span><button id="next">Sau →</button></div></section><div class="links"><a href="/">Aki Dev dashboard</a><a id="moderationLink" href="/moderation">Moderation console</a><a href="/privacy">Privacy</a><a href="/terms">Terms</a></div></main><script>
const $=id=>document.getElementById(id);let page=1,pages=1;function h(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function api(url,options){const r=await fetch(url,{credentials:'include',headers:{Accept:'application/json',...(options?.headers||{})},...options});const data=r.headers.get('content-type')?.includes('json')?await r.json():await r.text();if(!r.ok)throw new Error(data.error||data.message||'HTTP '+r.status);return data}
async function load(){const query=new URLSearchParams({page:String(page),limit:'20',q:$('q').value.trim()});if($('guild').value)query.set('guildId',$('guild').value);$('items').textContent='Đang tải…';try{const data=await api('/api/activity?'+query.toString());pages=data.pages||1;$('pageText').textContent='Trang '+page+'/'+pages+' · '+(data.total||0)+' sự kiện';if(!data.items.length){$('items').textContent='Không có dữ liệu phù hợp.';return}const host=$('items');host.replaceChildren();for(const row of data.items){const div=document.createElement('article');div.className='item';const time=document.createElement('div');time.className='time';time.textContent=new Date(row.created_at).toLocaleString('vi-VN');const action=document.createElement('div');action.className='action';action.textContent=(row.action||'event')+' · '+(row.user_id||'system');const details=document.createElement('div');details.className='details';details.textContent=row.details||'';div.append(time,action,details);host.append(div)}}catch(e){$('items').textContent=e.message;$('items').className='items error'}}
async function boot(){try{const me=await api('/api/me');if(!me.authenticated){$('status').textContent='LOGIN REQUIRED';$('items').textContent='Hãy đăng nhập Discord tại trang chủ trước.';return}$('status').textContent='AUTHENTICATED';const options=(me.manageableGuilds||[]).map(g=>'<option value="'+h(g.id)+'">'+h(g.name)+'</option>').join('');$('guild').innerHTML='<option value="">Tất cả server có quyền quản lý</option>'+options;const match=location.pathname.match(/guildId=([^&]+)/);if(match)$('guild').value=decodeURIComponent(match[1]);if($('guild').value)$('moderationLink').href='/moderation/'+$('guild').value;load()}catch(e){$('status').textContent='SESSION EXPIRED';$('items').textContent=e.message}}
$('search').onclick=()=>{page=1;load()};$('q').addEventListener('keydown',e=>{if(e.key==='Enter'){page=1;load()}});$('guild').onchange=()=>{page=1;$('moderationLink').href=$('guild').value?'/moderation/'+$('guild').value:'/moderation';load()};$('prev').onclick=()=>{if(page>1){page--;load()}};$('next').onclick=()=>{if(page<pages){page++;load()}};$('export').onclick=()=>{const query=new URLSearchParams({q:$('q').value.trim()});if($('guild').value)query.set('guildId',$('guild').value);location.href='/api/activity/export?'+query.toString()};boot();
</script></body></html>
