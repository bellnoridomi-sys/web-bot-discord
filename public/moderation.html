<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Aki Dev · Moderation</title><style>
:root{color-scheme:dark;--bg:#080808;--panel:#121212;--line:#2b2b2b;--muted:#9b9b95;--fg:#f4f4f1}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#191919,#080808 58%);color:var(--fg);font:14px/1.55 Inter,system-ui,sans-serif;padding:22px}main{max-width:1100px;margin:5vh auto}.eyebrow{font-size:10px;letter-spacing:.2em;color:#999}h1{font-size:clamp(36px,6vw,62px);letter-spacing:-.05em;line-height:1.02;margin:15px 0}.muted{color:var(--muted)}.panel{border:1px solid var(--line);border-radius:20px;background:rgba(17,17,17,.93);padding:18px;margin-top:20px}.tabs,.filters,.pager{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tabs button,button,input,select{background:#090909;border:1px solid #333;border-radius:11px;color:#eee;padding:10px 12px}.tabs button,.pager button{cursor:pointer}.tabs button.active{background:#eee;color:#111}.filters input{flex:1;min-width:190px}.items{margin-top:14px}.item{display:grid;grid-template-columns:60px 170px 160px 1fr auto;gap:10px;align-items:start;padding:13px 0;border-bottom:1px solid #252525}.item:last-child{border:0}.mutedSmall{font-size:11px;color:#999;overflow-wrap:anywhere}.reason{overflow-wrap:anywhere}.delete{color:#ffaaaa;cursor:pointer}.pager{margin-top:14px}.pager span{flex:1;color:#999}.error{color:#ff9b9b}.links{display:flex;gap:12px;margin-top:24px}.links a{color:#bbb;text-decoration:none;border-bottom:1px solid #444;padding-bottom:4px}@media(max-width:800px){.item{grid-template-columns:45px 1fr auto}.item .hide-mobile{display:none}}
</style></head><body><main><div class="eyebrow">AKI DEV / MODERATION CONSOLE</div><h1>Moderation<span style="color:#777">.</span></h1><div class="muted" id="guildLabel">Đang xác thực quyền moderator…</div><section class="panel"><div class="tabs"><button data-kind="warnings" class="active">Cảnh cáo</button><button data-kind="cases">Case log</button></div><div class="filters" style="margin-top:14px"><input id="q" placeholder="Tìm user ID, moderator, action, lý do…"><button id="search">TÌM KIẾM</button></div><div id="items" class="items" aria-live="polite">Đang tải…</div><div class="pager"><button id="prev">← Trước</button><span id="pageText">Trang 1</span><button id="next">Sau →</button></div></section><div class="links"><a href="/">Dashboard</a><a href="/activity">Activity stream</a><a href="/privacy">Privacy</a></div></main><script>
const $=id=>document.getElementById(id);let page=1,pages=1,kind='warnings',guildId=location.pathname.split('/').filter(Boolean).pop();if(!/^\d{17,20}$/.test(guildId))guildId='';
function h(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function api(url,options){const r=await fetch(url,{credentials:'include',headers:{Accept:'application/json',...(options?.headers||{})},...options});const data=r.headers.get('content-type')?.includes('json')?await r.json():await r.text();if(!r.ok)throw new Error(data.error||data.message||'HTTP '+r.status);return data}
async function load(){if(!guildId){$('items').textContent='Mở trang bằng /moderation/ID_SERVER sau khi đăng nhập Discord.';return}const params=new URLSearchParams({page:String(page),limit:'20',q:$('q').value.trim()});$('items').textContent='Đang tải…';try{const d=await api('/api/guilds/'+guildId+'/moderation/'+kind+'?'+params);pages=d.pages||1;$('pageText').textContent='Trang '+page+'/'+pages+' · '+(d.total||0)+' mục';$('guildLabel').textContent='Server ID: '+guildId+' · Yêu cầu quyền Moderate Members';const host=$('items');host.replaceChildren();if(!d.items.length){host.textContent='Không có dữ liệu phù hợp.';return}for(const row of d.items){const line=document.createElement('article');line.className='item';const id=document.createElement('div');id.className='mutedSmall';id.textContent='#'+(row.id??row.case_id);const user=document.createElement('div');user.className='hide-mobile';user.textContent=row.user_id||row.target_user_id||'';const actor=document.createElement('div');actor.className='mutedSmall hide-mobile';actor.textContent=(row.moderator_id||'')+(row.action?' · '+row.action:'');const reason=document.createElement('div');reason.className='reason';reason.textContent=(row.reason||'')+' · '+new Date(row.created_at).toLocaleString('vi-VN');line.append(id,user,actor,reason);if(kind==='warnings'){const del=document.createElement('button');del.className='delete';del.textContent='Xoá';del.onclick=async()=>{if(!confirm('Xoá cảnh cáo #'+row.id+'? Thao tác sẽ ghi case log.'))return;try{await api('/api/guilds/'+guildId+'/moderation/warnings/'+row.id,{method:'DELETE'});load()}catch(e){alert(e.message)}};line.append(del)}host.append(line)}}catch(e){$('items').className='items error';$('items').textContent=e.message}}
document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;page=1;document.querySelectorAll('[data-kind]').forEach(x=>x.classList.toggle('active',x===b));load()});$('search').onclick=()=>{page=1;load()};$('q').addEventListener('keydown',e=>{if(e.key==='Enter'){page=1;load()}});$('prev').onclick=()=>{if(page>1){page--;load()}};$('next').onclick=()=>{if(page<pages){page++;load()}};load();
</script></body></html>
